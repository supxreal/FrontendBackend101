<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Local</title>
    <!-- <link rel="icon" href="data:,"> -->

    <!-- เรียกใช้ไฟล์ CSS -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>

    <div class="mac-window">
        <div class="title-bar">
            <div class="mac-buttons">
                <span class="btn-close"></span>
                <span class="btn-min"></span>
                <span class="btn-max"></span>
            </div>
            <div class="title">Local Data Exchange</div>
        </div>

        <div class="content">
            <!-- ซ้าย: ฟอร์ม -->
            <div class="left-pane">
                <form id="dataForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="e.g. John" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" placeholder="What is this link about?" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Link / URL</label>
                        <input type="url" id="link" placeholder="https://..." required>
                    </div>
                    <button type="submit" class="btn-submit">Generate QR Code</button>
                </form>
                <button type="button" class="btn-clear" id="btnClear">Clear All Data</button>
            </div>

            <!-- ขวา: แสดงผล -->
            <div class="right-pane" id="summaryPane">
                <div class="no-data">No information yet</div>
            </div>
        </div>
    </div>

    <!-- เรียกใช้ไฟล์ JavaScript (เอาไว้ล่างสุดเพื่อให้โหลดหน้าเว็บเสร็จก่อน) -->
    <script src="/frontend/js/script.js"></script>
</body>
</html>
